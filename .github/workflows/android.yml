name: Build Looi Android
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: cd native && npm install && npm run web && npx cap add android && node scripts/patch-android.mjs && npx cap sync android
      - run: cd native/android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease
      # Optional signing: add repo secrets KEYSTORE_BASE64 (base64 of looi-release.jks) and KEYSTORE_PASSWORD
      - name: Sign
        if: ${{ env.KS != '' }}
        env: { KS: "${{ secrets.KEYSTORE_BASE64 }}", PW: "${{ secrets.KEYSTORE_PASSWORD }}" }
        run: |
          echo "$KS" | base64 -d > ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          O=native/android/app/build/outputs
          $BT/zipalign -f -p 4 $O/apk/release/app-release-unsigned.apk Looi.apk
          $BT/apksigner sign --ks ks.jks --ks-pass env:PW --ks-key-alias looi Looi.apk
          cp $O/bundle/release/app-release.aab Looi.aab
          jarsigner -keystore ks.jks -storepass "$PW" Looi.aab looi
      - uses: actions/upload-artifact@v4
        with: { name: looi-android, path: "Looi.apk\nLooi.aab\nnative/android/app/build/outputs/**/*.apk" }
