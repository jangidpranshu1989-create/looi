name: Deploy to Cloudflare

# Builds the web app + Docker image and deploys Worker + Container + R2 + cron.
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (+ optional app keys below).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "native/**", ".github/workflows/android.yml"]

concurrency: { group: cloudflare-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets > Actions, then run this workflow again."
            echo "SKIP=1" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: 22, cache: npm }
      - name: Build web app
        if: env.SKIP != '1'
        run: npm ci && npm run build
      - name: Install wrangler
        if: env.SKIP != '1'
        working-directory: cloudflare
        run: npm ci || npm i
      - name: Create R2 bucket (first deploy only)
        if: env.SKIP != '1'
        working-directory: cloudflare
        run: npx wrangler r2 bucket list | grep -q "looi-data" || npx wrangler r2 bucket create looi-data
      - name: Deploy Worker + Container (with secrets)
        if: env.SKIP != '1'
        working-directory: cloudflare
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOOI_AI_BASE_URL: ${{ secrets.LOOI_AI_BASE_URL }}
          LOOI_AI_KEY: ${{ secrets.LOOI_AI_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          LOOI_PUBLIC_URL: ${{ secrets.LOOI_PUBLIC_URL }}
        run: |
          node -e '
            const keys = ["NVIDIA_API_KEY","GROQ_API_KEY","OPENAI_API_KEY","LOOI_AI_BASE_URL","LOOI_AI_KEY","COMPOSIO_API_KEY","PSI_API_KEY","ADMIN_EMAILS","LOOI_PUBLIC_URL"];
            const o = {}; for (const k of keys) if (process.env[k]) o[k] = process.env[k];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(o));
            console.log("secrets:", Object.keys(o).join(", ") || "(none)");'
          npx wrangler deploy --secrets-file /tmp/secrets.json --containers-rollout immediate
          rm -f /tmp/secrets.json
      - name: Wait for Looi
        if: env.SKIP != '1'
        run: |
          echo "Deployed. The container boots on the first request or the next cron tick (2 min)."
          echo "Open https://looi.<your-subdomain>.workers.dev and sign up with an ADMIN_EMAILS address first."
