# One-click deploy: https://render.com/deploy?repo=https://github.com/jangidpranshu1989-create/looi
# Chromium + FFmpeg render real video ads, so give it at least 2 GB RAM ("standard").
services:
  - type: web
    name: looi
    runtime: docker
    plan: standard
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: looi-data
      mountPath: /app/looi-data
      sizeGB: 10
    envVars:
      - key: LOOI_SAAS
        value: "1"
      - key: LOOI_TRIAL_DAYS
        value: "7"
      - key: LOOI_PRICE_PRO_INR
        value: "999"
      - key: LOOI_PRICE_SCALE_INR
        value: "2999"
      - key: LOOI_WORKERS
        value: "2"
      - key: ADMIN_EMAILS
        sync: false
      - key: LOOI_PUBLIC_URL
        sync: false
      # Looi AI: the house brain every user gets without a key (tried in order, auto-failover)
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # One-click publishing plugins (X, LinkedIn, Instagram, Reddit, Slack, ...)
      - key: COMPOSIO_API_KEY
        sync: false
      # Google PageSpeed Insights fallback for audits
      - key: PSI_API_KEY
        sync: false
      # Payments (India: UPI, cards, netbanking)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
